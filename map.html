<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0e14">
<title>ESP32 GPS 定位</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<link rel="manifest" href="data:application/json,{}" />
<style>
  *{margin:0;padding:0;box-sizing:border-box}

  :root{
    --bg:#0b0e14;--surface:#141820;--surface2:#1a1f2b;
    --border:#252a35;--text:#e2e4e9;--text2:#8b8f9a;--text3:#5a5e6a;
    --green:#00d4aa;--red:#ff4757;--accent:#4f8fff;
    --panel-bg:rgba(20,24,32,0.9);--btn-bg:rgba(20,24,32,0.9);
    --title-from:#e2e4e9;--title-to:#8b8f9a;
  }
  body.light{
    --bg:#f5f5f5;--surface:#fff;--surface2:#f0f0f0;
    --border:#ddd;--text:#333;--text2:#666;--text3:#999;
    --panel-bg:rgba(255,255,255,0.9);--btn-bg:rgba(255,255,255,0.9);
    --title-from:#333;--title-to:#666;
  }
  body{font-family:-apple-system,'SF Pro Display',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;touch-action:manipulation;-webkit-text-size-adjust:100%}

  #map{width:100%;height:100%;background:var(--surface)}

  /* 顶部 */
  .topbar{position:absolute;top:0;left:0;right:0;z-index:1000;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;pointer-events:none}
  .topbar>*{pointer-events:auto}
  .title{font-size:2.2rem;font-weight:700;color:#f00}
  .conn-badge{display:flex;align-items:center;gap:8px;background:var(--panel-bg);backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:100px;padding:6px 14px;font-size:.7rem;color:var(--text2)}
  .conn-dot{width:8px;height:8px;border-radius:50%;background:var(--red);transition:background .4s}
  .conn-dot.live{background:var(--green);box-shadow:0 0 8px rgba(0,212,170,.4)}

  /* 底部面板 — 可上滑 */
  .infobar{
    position:absolute;bottom:20px;left:16px;right:16px;z-index:1000;
    background:var(--panel-bg);backdrop-filter:blur(12px);
    border:1px solid var(--border);border-radius:16px;
    padding:14px 18px;max-height:80px;overflow:hidden;
    transition:max-height .3s,bottom .3s;pointer-events:auto;
  }
  .infobar.expanded{max-height:420px;bottom:10px}
  .infobar-header{display:flex;justify-content:space-between;align-items:center;cursor:pointer}
  .info-coords{font-size:.85rem;color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
  .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin-top:10px}
  .info-item{font-size:.8rem;color:var(--text2)}
  .info-item span{color:var(--text);font-weight:600}
  .info-expand{display:none}
  .infobar.expanded .info-expand{display:block}
  .expand-icon{font-size:.7rem;color:var(--text3);transition:transform .3s}
  .infobar.expanded .expand-icon{transform:rotate(180deg)}
  /* 里程 */
  .mileage{font-size:.8rem;color:var(--accent);margin-top:8px;display:none}
  .infobar.expanded .mileage{display:block}

  /* 右侧按钮组 */
  .right-btns{position:absolute;right:16px;top:50%;transform:translateY(-50%);z-index:1000;display:flex;flex-direction:column;gap:6px}
  .rbtn{
    width:40px;height:40px;border-radius:12px;border:1px solid var(--border);
    background:var(--btn-bg);backdrop-filter:blur(10px);color:var(--text);
    font-size:1.1rem;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;
  }
  .rbtn:active{background:rgba(79,143,255,.2)}
  .rbtn.on{background:rgba(79,143,255,.3);border-color:var(--accent);color:var(--accent)}

  @media(max-width:767px){
    .rbtn{width:80px;height:80px;font-size:2rem;border-radius:18px}
    .right-btns{gap:8px;margin-top:60px}
    .title{font-size:1.6rem}
    .infobar{max-height:80px}.infobar.expanded{max-height:500px}
  }
  @media(min-width:768px){
    .infobar{left:50%;right:auto;transform:translateX(-50%);min-width:480px}
    .infobar.expanded{transform:translateX(-50%)}
    .title{font-size:2.6rem}
    .topbar{padding:16px 24px}
  }

  /* tooltip */
  .addr-tooltip{background:rgba(0,0,0,.78)!important;border:1px solid rgba(255,255,255,.2)!important;border-radius:8px!important;color:#fff!important;font-size:.8rem!important;padding:6px 12px!important;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.3)}
  .addr-tooltip::before{border-top-color:rgba(0,0,0,.78)!important}

  /* 回放控制栏 */
  .playback{position:absolute;top:70px;left:50%;transform:translateX(-50%);z-index:1000;background:var(--panel-bg);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:16px;padding:12px 16px;display:none;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
  .playback.show{display:flex}
  .playback input[type=date]{padding:4px 8px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:.75rem}
  .playback button{width:36px;height:36px;border-radius:8px;border:1px solid var(--border);background:var(--btn-bg);color:var(--text);cursor:pointer;font-size:1rem}
  .playback button:active{background:rgba(79,143,255,.2)}
  .playback select{padding:4px 8px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:.75rem}
  .playback .prog{flex:1;min-width:100px;height:4px;border-radius:2px;background:var(--border);cursor:pointer;position:relative}
  .playback .prog-fill{height:100%;border-radius:2px;background:var(--accent);width:0%}
  .playback .prog-label{font-size:.65rem;color:var(--text3);white-space:nowrap}

  /* 分享 toast */
  .share-toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--panel-bg);border:1px solid var(--border);border-radius:12px;padding:12px 20px;font-size:.85rem;color:var(--text);z-index:9999;display:none;box-shadow:0 8px 32px rgba(0,0,0,.5)}
  .share-toast.show{display:block;animation:fadeOut 2s forwards}
  @keyframes fadeOut{0%,60%{opacity:1}100%{opacity:0}}
</style>
</head>
<body>

<div id="map"></div>

<div class="topbar">
  <div class="title">GPS 定位，张伟伟</div>
  <div class="conn-badge">
    <div class="conn-dot" id="connDot"></div>
    <span id="connText">连接中</span>
  </div>
</div>

<!-- 右侧按钮组 -->
<div class="right-btns" id="rightBtns">
  <button class="rbtn" onclick="zoomIn()" title="放大">+</button>
  <button class="rbtn" onclick="zoomOut()" title="缩小">−</button>
  <button class="rbtn" id="btnFollow" onclick="toggleFollow()" title="跟随模式">🎯</button>
  <button class="rbtn" onclick="centerOnMarker()" title="定位设备">📍</button>
  <button class="rbtn" onclick="toggleTheme()" title="深/浅色" id="themeBtn">🌙</button>
  <button class="rbtn" id="btnPlayback" onclick="togglePlayback()" title="历史回放">⏮</button>
  <button class="rbtn" id="btnSim" onclick="toggleSim()" title="模拟定位">🧪</button>
  <button class="rbtn" onclick="shareLoc()" title="分享位置">🔗</button>
  <button class="rbtn" id="btnInstall" onclick="installPWA()" title="添加到桌面" style="display:none">📲</button>
</div>

<!-- 回放控制栏 -->
<div class="playback" id="playback">
  <input type="date" id="pbDate" onchange="loadPlayback()">
  <button onclick="pbPlay()" id="pbPlayBtn">▶</button>
  <button onclick="pbPause()">⏸</button>
  <button onclick="pbStep(-5)">⏪</button>
  <button onclick="pbStep(5)">⏩</button>
  <button onclick="pbStep(50)">⏭</button>
  <select id="pbSpeed" onchange="pbSpeed=parseFloat(this.value)">
    <option value="1">1x</option><option value="2">2x</option><option value="5">5x</option><option value="10">10x</option><option value="20">20x</option><option value="50">50x</option>
  </select>
  <div class="prog" id="pbProg" onclick="pbSeek(event)"><div class="prog-fill" id="pbFill"></div></div>
  <span class="prog-label" id="pbLabel">--</span>
</div>

<!-- 底部面板 -->
<div class="infobar" id="infobar">
  <div class="infobar-header" onclick="togglePanel()">
    <div class="info-coords" id="coords">等待 GPS 数据...</div>
    <span class="expand-icon">▲</span>
  </div>
  <div class="info-grid">
    <div class="info-item">📡 卫星 <span id="sat">--</span></div>
    <div class="info-item">⚡ 海拔 <span id="alt">--</span>m</div>
    <div class="info-item">🏃 速度 <span id="spd">--</span>km/h</div>
    <div class="info-item">🕐 更新 <span id="ts">--</span></div>
  </div>
  <div class="info-expand">
    <div class="mileage" id="mileage">📏 今日里程: 0.00 km</div>
    <div class="info-item" style="margin-top:6px">📍 精度 ±<span id="acc">--</span>m</div>
    <div class="info-item">🔔 围栏 <span id="fence">--</span></div>
  </div>
</div>

<div class="share-toast" id="shareToast"></div>

<script>
const $=id=>document.getElementById(id);

// ============= MQTT =============
const broker='wss://broker.emqx.io:8084/mqtt';
const client=mqtt.connect(broker,{
  clientId:'map_'+Math.random().toString(16).slice(2,10),
  clean:!0,connectTimeout:1e4,reconnectPeriod:3e3
});
let mqttConnected=!1,lastDataTime=0,lastUpdate=0;
client.on('connect',()=>{
  mqttConnected=!0;
  $('connDot').classList.add('live');$('connText').textContent='已连接';
  client.subscribe('esp32/gps');
  updateRelativeTime();
});
client.on('reconnect',()=>{
  mqttConnected=!1;
  $('connDot').classList.remove('live');$('connText').textContent='重连中';
});
client.on('offline',()=>{
  mqttConnected=!1;
  $('connDot').classList.remove('live');$('connText').textContent='已断开';
});
setInterval(updateRelativeTime,1e4);

// ============= Leaflet 地图 =============
const leafMap=L.map('map',{center:[31.23,121.47],zoom:15,attributionControl:!1,zoomControl:!1});

// 高德底图
const darkTiles=L.tileLayer('https://wprd0{s}.is.autonavi.com/appmaptile?x={x}&y={y}&z={z}&lang=zh_cn&size=1&scl=1&style=8',{subdomains:'1234',maxZoom:18});
const lightTiles=L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',{subdomains:'1234',maxZoom:18});
darkTiles.addTo(leafMap);
// 默认浅色
document.body.classList.add('light');leafMap.removeLayer(darkTiles);lightTiles.addTo(leafMap);
$('themeBtn').textContent='☀️';
document.querySelector('meta[name="theme-color"]').content='#f5f5f5';

function toggleTheme(){
  const isLight=document.body.classList.toggle('light');
  if(isLight){leafMap.removeLayer(darkTiles);lightTiles.addTo(leafMap);$('themeBtn').textContent='☀️';document.querySelector('meta[name="theme-color"]').content='#f5f5f5';localStorage.setItem('map_theme','light')}
  else{leafMap.removeLayer(lightTiles);darkTiles.addTo(leafMap);$('themeBtn').textContent='🌙';document.querySelector('meta[name="theme-color"]').content='#0b0e14';localStorage.setItem('map_theme','dark')}
}
(localStorage.getItem('map_theme')==='light')&&(document.body.classList.add('light'),leafMap.removeLayer(darkTiles),lightTiles.addTo(leafMap),$('themeBtn').textContent='☀️');

// 小车标记
const carIcon=L.divIcon({html:'<div style="width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:28px;filter:drop-shadow(2px 2px 3px rgba(0,0,0,.5))">🚗</div>',iconSize:[36,36],iconAnchor:[18,18],className:''});
const gpsMarker=L.marker([31.23,121.47],{icon:carIcon}).addTo(leafMap).bindTooltip('定位中...',{direction:'top',offset:[0,-20],className:'addr-tooltip'});

// 精度圈
const accuracyCircle=L.circle([31.23,121.47],{radius:100,color:'#4f8fff',weight:1,opacity:.5,fillOpacity:.1}).addTo(leafMap);

// 轨迹线（支持热力色）
let trackPoints=[],trackSegments=[],gpsHistory=[],lastLat=null,lastLng=null;

function addTrackPoint(lat,lng,spd){
  trackPoints.push([lat,lng]);
  if(trackPoints.length>500)trackPoints.shift();
  // 颜色按速度着色
  const speed=spd||0,c=speed>40?'#ff4757':speed>20?'#ffba3b':speed>5?'#4f8fff':'#00d4aa';
  if(lastLat!==null){
    trackSegments.push({coords:[[lastLat,lastLng],[lat,lng]],color:c});
    if(trackSegments.length>500)trackSegments.shift();
  }
  lastLat=lat;lastLng=lng;

  // 重绘轨迹线
  drawTrack();
}

function drawTrack(){
  // 移除旧线
  leafMap.eachLayer(l=>{if(l._trackLine)leafMap.removeLayer(l)});
  // 简单折线（省性能）
  if(trackPoints.length>1){
    const line=L.polyline(trackPoints,{color:'#4f8fff',weight:3,opacity:.6});
    line._trackLine=!0;line.addTo(leafMap);
  }
  // 里程
  updateMileage();
}

let totalMileage=0;
function updateMileage(){
  if(trackPoints.length<2)return;
  let d=0;
  for(let i=1;i<trackPoints.length;i++){
    const lat1=trackPoints[i-1][0],lng1=trackPoints[i-1][1],
          lat2=trackPoints[i][0],lng2=trackPoints[i][1];
    const r=.0089932; // 0.01deg ≈ 1.11km at lat 30
    d+=Math.sqrt(Math.pow((lat2-lat1)*111.32,2)+Math.pow((lng2-lng1)*111.32*Math.cos(lat1*Math.PI/180),2));
  }
  totalMileage+=d*.1; // 累积
  $('mileage').textContent='📏 今日里程: '+totalMileage.toFixed(2)+' km';
}

// ============= 逆地理编码 =============
const AMAP_KEY='971a6c461c7c46e28b04ff621ac62a61';
let lastGeoLat=0,lastGeoLng=0,lastAcc=0;
function reverseGeocode(lat,lng){
  if(Math.abs(lat-lastGeoLat)<5e-4&&Math.abs(lng-lastGeoLng)<5e-4)return;
  lastGeoLat=lat;lastGeoLng=lng;
  fetch('https://restapi.amap.com/v3/geocode/regeo?key='+AMAP_KEY+'&location='+lng+','+lat+'&extensions=base&output=json')
    .then(r=>r.json()).then(d=>{
      if(d.status==='1'&&d.regeocode){
        const c=d.regeocode.addressComponent||{};
        const dis=c.district?c.district+' · ':'';
        const st=(c.streetNumber||{}).street||'';
        const nb=(c.streetNumber||{}).number||'';
        gpsMarker.setTooltipContent((dis+st+(nb||'附近')).trim()||d.regeocode.formatted_address||'');
      }
    }).catch(()=>{});
}

// ============= 跟随模式 =============
let followMode=!1;
function toggleFollow(){
  followMode=!followMode;
  $('btnFollow').classList.toggle('on',followMode);
  if(followMode){const p=gpsMarker.getLatLng();leafMap.setView(p,16)}
}

// ============= 上滑面板 =============
function togglePanel(){
  $('infobar').classList.toggle('expanded');
}

// ============= 分享位置 =============
function shareLoc(){
  const p=gpsMarker.getLatLng();
  const url=location.origin+location.pathname+'?lat='+p.lat.toFixed(6)+'&lng='+p.lng.toFixed(6);
  navigator.clipboard?.writeText(url).then(()=>{
    const t=$('shareToast');t.textContent='✅ 位置链接已复制';t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'),2e3);
  }).catch(()=>{
    const t=$('shareToast');t.textContent=url;t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'),3e3);
  });
}

// ============= 模拟路线 — 上海人民广场 → 盐城滨海（沿 G15） =============
// [lat, lng, 限速km/h] — 密集采点沿真实高速路线
const ROUTE=[
  // 上海城区 → S5沪嘉高速
  [31.2304,121.4737,35],[31.2350,121.4680,40],[31.2420,121.4580,50],[31.2500,121.4500,55],
  [31.2600,121.4400,60],[31.2720,121.4280,60],[31.2850,121.4180,70],[31.2980,121.4050,80],
  [31.3100,121.3900,90],[31.3250,121.3700,100],
  // G15 沈海高速 — 嘉定→太仓
  [31.3400,121.3500,110],[31.3580,121.3250,110],[31.3780,121.2980,110],[31.3980,121.2700,110],
  [31.4180,121.2450,110],[31.4380,121.2250,110],[31.4550,121.2050,110],
  // 太仓→常熟
  [31.4700,121.1800,110],[31.4880,121.1520,110],[31.5060,121.1250,110],[31.5250,121.1000,110],
  [31.5450,121.0750,110],[31.5650,121.0500,110],
  // 常熟→张家港
  [31.5850,121.0200,110],[31.6080,120.9900,110],[31.6320,120.9600,110],[31.6580,120.9350,110],
  [31.6850,120.9120,110],[31.7150,120.8950,110],
  // 张家港→苏通大桥
  [31.7450,120.8800,110],[31.7700,120.8700,110],[31.7980,120.8620,100],[31.8250,120.8550,90],
  // 苏通大桥(过长江)
  [31.8500,120.8480,80],[31.8700,120.8420,80],[31.8900,120.8380,80],[31.9100,120.8350,80],
  // 南通→如皋
  [31.9350,120.8300,110],[31.9600,120.8250,110],[31.9850,120.8220,110],[32.0120,120.8200,110],
  [32.0380,120.8180,110],[32.0650,120.8100,110],
  // 如皋→海安
  [32.0920,120.8000,110],[32.1200,120.7900,110],[32.1480,120.7780,110],[32.1780,120.7650,110],
  [32.2080,120.7520,110],[32.2400,120.7400,110],
  // 海安→东台
  [32.2720,120.7280,110],[32.3050,120.7120,110],[32.3400,120.6920,110],[32.3780,120.6700,110],
  [32.4150,120.6480,110],[32.4500,120.6250,110],
  // 东台→大丰
  [32.4850,120.6000,110],[32.5200,120.5750,110],[32.5580,120.5500,110],[32.5950,120.5280,110],
  [32.6320,120.5050,110],[32.6700,120.4850,110],
  // 大丰→盐城南
  [32.7100,120.4650,110],[32.7500,120.4480,100],[32.7900,120.4300,100],[32.8300,120.4100,100],
  [32.8700,120.3920,100],[32.9100,120.3700,100],
  // 盐城市区
  [32.9500,120.3500,90],[32.9900,120.3320,80],[33.0300,120.3180,70],[33.0700,120.3050,60],
  [33.1100,120.2920,60],[33.1500,120.2780,60],[33.1900,120.2650,60],[33.2300,120.2500,60],
  [33.2700,120.2350,60],[33.3100,120.2200,60],
  // 盐城→射阳/阜宁
  [33.3500,120.2050,80],[33.3900,120.1920,80],[33.4300,120.1780,80],[33.4700,120.1620,80],
  [33.5100,120.1420,80],[33.5500,120.1220,80],[33.5900,120.1020,80],[33.6300,120.0820,80],
  // 阜宁→滨海南
  [33.6700,120.0600,70],[33.7100,120.0350,70],[33.7500,120.0080,70],[33.7900,119.9820,70],
  [33.8300,119.9550,70],[33.8700,119.9280,70],
  // 滨海县城
  [33.9100,119.9020,50],[33.9450,119.8780,40],[33.9750,119.8620,35],[34.0000,119.8500,30],
];
// 反向路线（滨海→上海）
const ROUTE_REV=ROUTE.slice().reverse();

let simRunning=!1,simTimer=null;
let simSegIdx=0,simSegProgress=0;  // 当前路段索引, 路段内进度 0~1
let simForward=!0;  // true=上海→滨海, false=滨海→上海
let simLat=ROUTE[0][0],simLng=ROUTE[0][1];

function lerp(a,b,t){return a+(b-a)*t}

function toggleSim(){
  simRunning=!simRunning;$('btnSim').classList.toggle('on',simRunning);
  if(simRunning){
    $('connDot').classList.add('live');$('connText').textContent='模拟中';
    $('btnSim').textContent='⏹';
    // 从上次位置最近的路段继续
    let bestDist=Infinity,bestSeg=0;
    (simForward?ROUTE:ROUTE_REV).forEach((p,i)=>{
      const d=Math.hypot(simLat-p[0],simLng-p[1]);
      if(d<bestDist){bestDist=d;bestSeg=i}
    });
    simSegIdx=Math.min(bestSeg,(simForward?ROUTE:ROUTE_REV).length-2);
    simSegProgress=0;
    simStep();simTimer=setInterval(simStep,3e3);
  }else{
    clearInterval(simTimer);
    $('connText').textContent='手动停止';
    setTimeout(()=>{$('btnSim').textContent='🧪'},1500);
  }
}

function simStep(){
  const route=simForward?ROUTE:ROUTE_REV;
  const segs=route.length-1;
  if(simSegIdx>=segs){simSegIdx=0;simSegProgress=0;simForward=!simForward}

  const [lat0,lng0]=route[simSegIdx];
  const [lat1,lng1,limit]=route[simSegIdx+1];

  // 路段内前进（城区慢、高速快）
  const spd=limit*(.7+Math.random()*.3);  // 70%~100% 限速
  const segLen=Math.hypot((lat1-lat0)*111320,(lng1-lng0)*111320*Math.cos((lat0+lat1)/2*Math.PI/180));
  const step=spd*3/3.6/segLen;  // 3 秒前进比例
  simSegProgress+=step;

  if(simSegProgress>=1){
    simSegProgress-=1;
    simSegIdx++;
    if(simSegIdx>=segs){simSegIdx=0;simSegProgress=0;simForward=!simForward;return simStep()}
    return simStep();
  }

  simLat=lerp(lat0,lat1,simSegProgress);
  simLng=lerp(lng0,lng1,simSegProgress);

  // 添加微小抖动模拟真实 GPS（±5m）
  const jitter=.00005;
  const dLat=simLat+(Math.random()-.5)*jitter;
  const dLng=simLng+(Math.random()-.5)*jitter;

  const fakeData={
    lat:dLat,lng:dLng,
    alt:Number((3+Math.random()*8).toFixed(1)),
    spd:Number(spd.toFixed(1)),
    sat:8+Math.floor(Math.random()*10),
    fix:1,acc:5+Math.floor(Math.random()*15)
  };
  updateDisplay(fakeData);

  // 注入 MQTT 消息事件
  try{
    const h=client._events?.message;
    if(h)h('esp32/gps',{toString:()=>JSON.stringify(fakeData)});
  }catch(e){}
}

// ============= PWA 安装 =============
let deferredPrompt;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;$('btnInstall').style.display=''});
function installPWA(){deferredPrompt&&(deferredPrompt.prompt(),deferredPrompt.userChoice.then(()=>{$('btnInstall').style.display='none'}))}

// ============= 历史回放 =============
let pbData=[],pbIndex=-1,pbRunning=!1,pbTimer=null,pbSpeed=1;
function togglePlayback(){
  $('playback').classList.toggle('show');
  // 默认填今天日期
  const d=new Date();
  $('pbDate').value=d.toISOString().slice(0,10);
  loadPlayback();
}

function loadPlayback(){
  pbPause();pbIndex=-1;
  const date=$('pbDate').value||new Date().toISOString().slice(0,10);
  // 从 PHP API 加载历史
  fetch('https://www.sseeee.com/esp32/mmq/api.php?date='+date)
    .then(r=>r.json()).then(d=>{
      if(d.status==='ok'&&d.data.length>0){
        pbData=d.data.filter(p=>p.lat&&p.lng&&p.lat!==0);
        $('pbLabel').textContent=pbData.length+'条 ';pbPlay();
      }else{
        pbData=[];$('pbLabel').textContent='无数据';
      }
    }).catch(()=>{$('pbLabel').textContent='API 不可用'});
}

function pbPlay(){
  if(!pbData.length||pbRunning)return;
  pbRunning=!0;$('pbPlayBtn').textContent='⏯';
  if(pbIndex<0)pbIndex=0;
  const step=()=>{
    if(!pbRunning||pbIndex>=pbData.length){pbPause();return}
    const p=pbData[pbIndex];
    gpsMarker.setLatLng([p.lat,p.lng]);
    leafMap.setView([p.lat,p.lng],leafMap.getZoom());
    $('coords').textContent=p.lng.toFixed(6)+', '+p.lat.toFixed(6);
    $('sat').textContent=p.sat||'--';$('alt').textContent=(p.alt||0).toFixed(1);
    $('spd').textContent=(p.spd||0).toFixed(1);$('ts').textContent=p.ts||'--';
    reverseGeocode(p.lat,p.lng);
    addTrackPoint(p.lat,p.lng,p.spd);
    pbIndex++;
    $('pbFill').style.width=(pbIndex/pbData.length*100)+'%';
    $('pbLabel').textContent=pbIndex+'/'+pbData.length;
    pbTimer=setTimeout(step,300/pbSpeed);
  };
  step();
}
function pbPause(){pbRunning=!1;$('pbPlayBtn').textContent='▶';clearTimeout(pbTimer)}
function pbStep(n){pbRunning&&pbPause();pbIndex=Math.max(0,Math.min(pbData.length-1,(pbIndex<0?0:pbIndex)+n));const p=pbData[pbIndex];if(p){gpsMarker.setLatLng([p.lat,p.lng]);leafMap.setView([p.lat,p.lng],leafMap.getZoom());$('pbFill').style.width=(pbIndex/pbData.length*100)+'%';$('pbLabel').textContent=pbIndex+'/'+pbData.length}}
function pbSeek(e){const rect=$('pbProg').getBoundingClientRect(),pct=(e.clientX-rect.left)/rect.width;pbIndex=Math.floor(pct*pbData.length);const p=pbData[pbIndex];if(p){gpsMarker.setLatLng([p.lat,p.lng]);leafMap.setView([p.lat,p.lng],leafMap.getZoom());$('pbFill').style.width=(pbIndex/pbData.length*100)+'%'}}

// ============= 围栏通知 =============
let fenceCenter=null,fenceRadius=500;
let lastFenceMsg='';

function checkFence(lat,lng){
  if(!fenceCenter||window.Notification?.permission!=='granted')return;
  const d=Math.sqrt(Math.pow((lat-fenceCenter[0])*111320,2)+Math.pow((lng-fenceCenter[1])*111320*Math.cos(lat*Math.PI/180),2));
  if(d>fenceRadius&&lastFenceMsg!=='out'){
    lastFenceMsg='out';
    try{new Notification('设备离开围栏',{body:'距离围栏中心 '+Math.round(d)+'m',icon:'🚗'})}catch(e){}
  }else if(d<=fenceRadius&&lastFenceMsg!=='in'){
    lastFenceMsg='in';
    try{new Notification('设备进入围栏',{body:'距离围栏中心 '+Math.round(d)+'m',icon:'🚗'})}catch(e){}
  }
  $('fence').textContent=lastFenceMsg==='in'?'内':'外';
}
// 请求通知权限
function requestNotify(){
  if('Notification' in window&&Notification.permission==='default')
    Notification.requestPermission();
  // 初始化围栏中心为当前位置
  if(!fenceCenter){const p=gpsMarker.getLatLng();fenceCenter=[p.lat,p.lng]}
}

// ============= 缩放 =============
function zoomIn(){leafMap.zoomIn()}
function zoomOut(){leafMap.zoomOut()}
function centerOnMarker(){
  const p=gpsMarker.getLatLng();leafMap.setView(p,16);
}

// ============= 相对时间 =============
function updateRelativeTime(){
  if(!lastUpdate)return;
  const elapsed=Math.floor((Date.now()-lastUpdate)/1e3);
  let txt;
  if(elapsed<10)txt='刚刚';
  else if(elapsed<60)txt=elapsed+'秒前';
  else if(elapsed<3600)txt=Math.floor(elapsed/60)+'分钟前';
  else txt=Math.floor(elapsed/3600)+'小时前';
  $('ts').textContent=txt;
}

// ============= 数据更新 =============
client.on('message',(topic,payload)=>{
  lastDataTime=Date.now();
  try{
    const d=JSON.parse(payload.toString());
    if(d.fix>0&&d.lat&&d.lng&&(d.lat!==0||d.lng!==0)){
      updateDisplay(d);
    }
  }catch(e){}
});

function updateDisplay(d){
  const lat=Number(d.lat),lng=Number(d.lng);
  lastUpdate=Date.now();
  lastAcc=d.accuracy||d.acc||0;

  reverseGeocode(lat,lng);
  gpsMarker.setLatLng([lat,lng]);
  accuracyCircle.setLatLng([lat,lng]);

  if(followMode)leafMap.setView([lat,lng],leafMap.getZoom(),{animate:!0});

  addTrackPoint(lat,lng,Number(d.spd||0));
  gpsHistory.push({ts:Date.now(),lat,lng,spd:d.spd||0,alt:d.alt||0,sat:d.sat||0});
  if(gpsHistory.length>1e4)gpsHistory.shift();

  checkFence(lat,lng);
  updateRelativeTime();

  $('coords').textContent=lng.toFixed(6)+', '+lat.toFixed(6);
  $('sat').textContent=d.sat||'--';
  $('alt').textContent=(d.alt||0).toFixed(1);
  $('spd').textContent=(d.spd||0).toFixed(1);
  $('acc').textContent=lastAcc||'--';
}

// ============= 启动 =============
setTimeout(()=>leafMap.invalidateSize(),300);
window.addEventListener('resize',()=>leafMap.invalidateSize());
document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:!1});
document.addEventListener('gesturechange',e=>e.preventDefault(),{passive:!1});
document.addEventListener('gestureend',e=>e.preventDefault(),{passive:!1});
requestNotify();
</script>

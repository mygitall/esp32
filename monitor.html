<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0e14">
<link rel="manifest" href="manifest.json">
<title>ESP32 环境监控</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0b0e14;
    --surface: #141820;
    --surface2: #1a1f2b;
    --border: #252a35;
    --text: #e2e4e9;
    --text2: #8b8f9a;
    --text3: #5a5e6a;
    --accent: #4f8fff;
    --accent2: #6c5ce7;
    --warm: #ff7b42;
    --green: #00d4aa;
    --gold: #ffba3b;
    --red: #ff4757;
    --radius: 18px;
    --radius-sm: 12px;
  }

  body {
    font-family: -apple-system, 'SF Pro Display', 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 16px;
    touch-action: manipulation;
    -webkit-text-size-adjust: 100%;
    background-image:
      radial-gradient(ellipse at 20% 10%, rgba(79, 143, 255, 0.05) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 50%, rgba(255, 123, 66, 0.04) 0%, transparent 50%);
  }

  .app { width: 100%; max-width: 440px; }

  /* ---- 顶部 ---- */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px; padding: 0 4px;
  }
  .topbar h1 {
    font-size: 1.2rem; font-weight: 700; letter-spacing: -0.3px;
    background: linear-gradient(135deg, #e2e4e9, #8b8f9a);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .conn-badge {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 100px; padding: 6px 14px 6px 10px;
    font-size: 0.72rem; color: var(--text2);
  }
  .conn-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #ff6b6b; transition: background 0.4s;
  }
  .conn-dot.live { background: var(--green); box-shadow: 0 0 8px rgba(0,212,170,0.4); }

  /* ---- 仪表盘 ---- */
  .gauges {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px;
  }
  .gauge {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px 12px; text-align: center;
    position: relative; overflow: hidden;
  }
  .gauge .icon { font-size: 1.3rem; margin-bottom: 2px; }
  .gauge .val {
    font-size: 2.6rem; font-weight: 800; letter-spacing: -1px; line-height: 1;
  }
  .gauge.temp .val { color: var(--warm); }
  .gauge.hum .val { color: var(--accent); }
  .gauge .unit { font-size: 1rem; opacity: 0.5; font-weight: 500; }
  .gauge .lbl { font-size: 0.7rem; color: var(--text3); text-transform: uppercase; letter-spacing: 1.5px; }
  .gauge .trend { font-size: 0.7rem; margin-top: 2px; color: var(--text3); }
  .gauge .spark { display: block; margin: 4px auto 0; opacity: 0.6; max-width: 100%; height: auto; }

  /* ---- Section ---- */
  .section {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px; margin-bottom: 10px;
  }
  .section-title {
    font-size: 0.72rem; text-transform: uppercase; letter-spacing: 1.5px;
    color: var(--text3); margin-bottom: 12px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .section-title .btn-sm {
    font-size: 0.65rem; padding: 4px 10px; border-radius: 6px;
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text2); cursor: pointer;
  }
  .btn-sm:active { background: rgba(79,143,255,0.15); border-color: rgba(79,143,255,0.4); }
  .btn-sm.active { background: rgba(79,143,255,0.2); border-color: rgba(79,143,255,0.45); color: #4f8fff; }

  /* ---- Chart ---- */
  .chart-wrap { position: relative; height: 200px; overflow: hidden; }
  .map-wrap { position: relative; height: 200px; border-radius: var(--radius-sm); overflow: hidden; margin-bottom: 4px; }
  .map-wrap .leaflet-container { width: 100%; height: 100%; background: var(--surface); }
  .gps-coords { font-size: 0.7rem; color: var(--text3); text-align: center; padding: 4px 0; }
  .chart-wrap canvas { width: 100% !important; height: 100% !important; }
  .crosshair {
    display: none; position: absolute; top: 0; bottom: 0;
    width: 1px; pointer-events: none; z-index: 10;
    border-left: 1px dashed rgba(255,255,255,0.5);
  }
  .crosshair.show { display: block; }
  .crosshair-tag {
    position: absolute; left: 6px; padding: 2px 6px; border-radius: 4px;
    font-size: 10px; font-weight: 700; white-space: nowrap;
    color: #fff; pointer-events: none;
  }
  .crosshair-tag.temp { background: rgba(255,123,66,0.85); top: -2px; }
  .crosshair-tag.hum  { background: rgba(79,143,255,0.85); top: 20px; }

  /* ---- Alert ---- */
  .alert-bar {
    display: none; padding: 10px 14px; border-radius: 10px;
    font-size: 0.82rem; font-weight: 600; text-align: center; margin-bottom: 10px;
    animation: shake 0.4s ease;
  }
  .alert-bar.show { display: block; }
  .alert-bar.danger {
    background: rgba(255,71,87,0.15); border: 1px solid rgba(255,71,87,0.35);
    color: var(--red);
  }
  .alert-bar.warn {
    background: rgba(255,186,59,0.12); border: 1px solid rgba(255,186,59,0.3);
    color: var(--gold);
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }

  .thresh-row {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  }
  .thresh-item {
    display: flex; align-items: center; gap: 6px;
    font-size: 0.78rem; color: var(--text2);
  }
  .thresh-item input {
    width: 56px; padding: 6px 8px; border-radius: 8px;
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); font-size: 0.8rem; text-align: center;
  }
  .thresh-item select {
    padding: 6px 8px; border-radius: 8px;
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); font-size: 0.75rem;
  }

  /* ---- Switches ---- */
  .ctrl-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 0;
  }
  .ctrl-row + .ctrl-row { border-top: 1px solid var(--border); }
  .ctrl-left { display: flex; align-items: center; gap: 12px; }
  .ctrl-icon { font-size: 1.4rem; width: 28px; text-align: center; }
  .ctrl-info .ctrl-name { font-size: 0.85rem; font-weight: 600; }
  .ctrl-info .ctrl-status { font-size: 0.7rem; color: var(--text3); }

  .toggle {
    width: 52px; height: 30px; border-radius: 100px;
    background: #2a3040; border: none; cursor: pointer;
    position: relative; transition: background 0.3s;
    flex-shrink: 0;
  }
  .toggle.on { background: var(--gold); }
  .toggle::after {
    content: ''; position: absolute; top: 3px; left: 3px;
    width: 24px; height: 24px; border-radius: 50%; background: #fff;
    transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
  }
  .toggle.on::after { transform: translateX(22px); }

  /* ---- Footer ---- */
  .footer {
    text-align: center; font-size: 0.68rem; color: var(--text3); padding: 6px;
  }


  /* ---- 断线蒙版 ---- */
  .dc-overlay {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(11,14,20,0.85); z-index: 100;
    justify-content: center; align-items: center; flex-direction: column; gap: 12px;
  }
  .dc-overlay.show { display: flex; }
  .dc-overlay .dc-icon { font-size: 3rem; }
  .dc-overlay .dc-msg { font-size: 0.9rem; color: #8b8f9a; }
  .dc-overlay .dc-sub { font-size: 0.7rem; color: #5a5e6a; }
  .body-disconnected { filter: grayscale(60%) opacity(0.6); transition: all 0.5s; }
  /* ---- Toast ---- */
  .toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-120px);
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 12px; padding: 10px 22px; font-size: 0.85rem;
    transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
    z-index: 99; box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="app">
  <div class="toast" id="toast"></div>

  <!-- 顶部 -->
  <div class="topbar">
    <h1>ESP32 环境监控</h1>
    <div class="conn-badge">
      <div class="conn-dot" id="connDot"></div>
      <span id="connText">连接中</span>
    </div>
  </div>

  <!-- 告警条 -->
  <div class="alert-bar" id="alertBar"></div>

  <!-- 温湿度仪表盘 -->
  <div class="gauges">
    <div class="gauge temp">
      <div class="icon">🌡️</div>
      <div class="val"><span id="tempVal">--</span><span class="unit">°C</span></div>
      <canvas class="spark" id="sparkTemp" width="140" height="32"></canvas>
      <div class="lbl">温度</div>
      <div class="trend" id="tempTrend"></div>
    </div>
    <div class="gauge hum">
      <div class="icon">💧</div>
      <div class="val"><span id="humVal">--</span><span class="unit">%</span></div>
      <canvas class="spark" id="sparkHum" width="140" height="32"></canvas>
      <div class="lbl">湿度</div>
      <div class="trend" id="humTrend"></div>
    </div>
  </div>

  <!-- GPS 定位 -->
  <div class="section">
    <div class="section-title">📍 设备位置</div>
    <div class="map-wrap" id="mapWrap"><div id="leafMap"></div></div>
    <div class="gps-coords" id="gpsCoords">等待 GPS 定位...</div>
  </div>

  <!-- 历史曲线 -->
  <div class="section">
    <div class="section-title">
      📈 历史曲线
      <div style="display:flex;gap:6px">
        <button class="btn-sm" data-mode="today" onclick="loadHistory('today')">今天</button>
        <button class="btn-sm" data-mode="yesterday" onclick="loadHistory('yesterday')">昨天</button>
        <button class="btn-sm" data-mode="7days" onclick="loadHistory('7days')">近7天</button>
        <button class="btn-sm" onclick="exportCSV()">📥 CSV</button>
      </div>
    </div>
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px;font-size:0.72rem;color:var(--text2);flex-wrap:wrap">
      <input type="date" id="histDate" style="padding:4px 8px;border-radius:6px;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-size:0.7rem" onchange="loadHistory('date')">
      <input type="time" id="histFrom" value="00:00" style="padding:4px 8px;border-radius:6px;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-size:0.7rem;width:60px" onchange="loadHistory('date')">
      <span>—</span>
      <input type="time" id="histTo" value="23:59" style="padding:4px 8px;border-radius:6px;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-size:0.7rem;width:60px" onchange="loadHistory('date')">
      <span id="histCount" style="color:var(--text3)"></span>
    </div>
    <div class="chart-wrap">
      <canvas id="chartCanvas"></canvas>
      <div id="crosshair" class="crosshair"><div class="crosshair-tag temp"></div><div class="crosshair-tag hum"></div></div>
    </div>
  </div>

  <!-- 告警设置 -->
  <div class="section">
    <div class="section-title">⚙️ 告警设置</div>
    <div class="thresh-row">
      <div class="thresh-item">
        温度上限 <input type="number" id="tempMax" value="35" min="0" max="80" onchange="saveThresholds()"> °C
      </div>
      <div class="thresh-item">
        湿度下限 <input type="number" id="humMin" value="20" min="0" max="100" onchange="saveThresholds()"> %
      </div>
      <div class="thresh-item">
        <select id="alertMode" onchange="saveThresholds()">
          <option value="both">温度+湿度</option>
          <option value="temp">仅温度</option>
          <option value="hum">仅湿度</option>
        </select>
      </div>
    </div>
  </div>

  <!-- 设备控制 -->
  <div class="section">
    <div class="section-title">🎛️ 设备控制</div>
    <div class="ctrl-row">
      <div class="ctrl-left">
        <div class="ctrl-icon">💡</div>
        <div class="ctrl-info">
          <div class="ctrl-name">LED 指示灯</div>
          <div class="ctrl-status" id="ledStatus">已关闭</div>
        </div>
      </div>
      <button class="toggle off" id="ledToggle" onclick="toggleDevice('led')"></button>
    </div>
  </div>

  <!-- 底部状态 -->
  <div class="footer">
    📶 <span id="rssiVal">--</span> &nbsp;|&nbsp;
    ⏱ <span id="uptimeVal">--</span> &nbsp;|&nbsp;
    更新 <span id="updatedAt">--:--:--</span>
  </div>
</div>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<script>
  // ==================== 配置 ====================
  const broker = 'wss://broker.emqx.io:8084/mqtt';
  const MAX_HISTORY = 100000; // LZ-String 压缩后约 1.5MB（10万条 ≈ 5MB 未压缩）
  const API_BASE = 'api.php';  // PHP API 地址

  // ==================== 状态 ====================
  let ledOn = false;
  let lastTemp = null, lastHum = null;
  let history = []; // [{ts, temp, hum}]
  let sparkTemp = [], sparkHum = []; // 最近 30 点用于迷你趋势线
  const SPARK_MAX = 30;
  let thresholds = { tempMax: 35, humMin: 20, alertMode: 'both' };

  const $ = (id) => document.getElementById(id);

  // ==================== 阈值持久化 ====================
  function loadThresholds() {
    try {
      const saved = JSON.parse(localStorage.getItem('esp32_thresholds'));
      if (saved) {
        thresholds = saved;
        $('tempMax').value = thresholds.tempMax;
        $('humMin').value = thresholds.humMin;
        $('alertMode').value = thresholds.alertMode;
      }
    } catch(e) {}
  }
  function saveThresholds() {
    thresholds.tempMax = parseInt($('tempMax').value) || 35;
    thresholds.humMin = parseInt($('humMin').value) || 20;
    thresholds.alertMode = $('alertMode').value;
    localStorage.setItem('esp32_thresholds', JSON.stringify(thresholds));
    if (chart) chart.update(); // 刷新阈值参考线
  }
  loadThresholds();

  // ==================== MQTT 连接（指数退避 3s→30s） ====================
  let mqttReconnectAttempts = 0;

  function getReconnectDelay() {
    const d = Math.min(3000 * Math.pow(1.5, mqttReconnectAttempts), 30000);
    mqttReconnectAttempts++;
    return d;
  }

  const client = mqtt.connect(broker, {
    clientId: 'dash_' + Math.random().toString(16).slice(2, 10),
    clean: true, connectTimeout: 10000, reconnectPeriod: 3000
  });

  client.on('connect', () => {
    mqttReconnectAttempts = 0;
    client.options.reconnectPeriod = 3000;
    $('connDot').classList.add('live');
    $('connText').textContent = '已连接';
    client.subscribe(['esp32/temp','esp32/hum','esp32/status','esp32/led','esp32/gps']);
  });

  client.on('reconnect', () => {
    const delay = getReconnectDelay();
    client.options.reconnectPeriod = delay;
    $('connDot').classList.remove('live');
    $('connText').textContent = '重连中(' + Math.round(delay / 1000) + 's)';
  });

  client.on('offline', () => {
    $('connDot').classList.remove('live');
    $('connText').textContent = '已断开';
  });

  // ==================== 断线检测 ====================
  const DISCONNECT_TIMEOUT = 6000; // 12 秒
  let lastDataTime = Date.now();
  let disconnected = false;

  function checkDisconnect() {
    const elapsed = Date.now() - lastDataTime;
    if (elapsed >= DISCONNECT_TIMEOUT && !disconnected) {
      disconnected = true;
      $('dcOverlay').classList.add('show');
      document.body.classList.add('body-disconnected');
      sendNotify('ESP32 连接中断', '超过 6 秒未收到数据，请检查设备');
    } else if (elapsed < DISCONNECT_TIMEOUT && disconnected) {
      disconnected = false;
      $('dcOverlay').classList.remove('show');
      document.body.classList.remove('body-disconnected');
    }
  }
  setInterval(checkDisconnect, 1000); // 每 1 秒检查

  // ==================== 消息处理 ====================

  // 收到任何数据时更新时间戳
  function touchData() { lastDataTime = Date.now(); }
  let currentTemp = null, currentHum = null;

  // ==================== Leaflet 地图 ====================
  let leafMap, gpsMarker;

  function initMap() {
    leafMap = L.map('leafMap', {
      center: [31.23, 121.47], zoom: 15,
      attributionControl: false, zoomControl: false
    });
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19
    }).addTo(leafMap);
    // 修复默认 marker 图标
    delete L.Icon.Default.prototype._getIconUrl;
    L.Icon.Default.mergeOptions({
      iconUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png',
      shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png'
    });
    gpsMarker = L.marker([31.23, 121.47]).addTo(leafMap);
    // 初始化后再 resize 一次
    setTimeout(() => leafMap.invalidateSize(), 500);
  }

  function updateMarker(lat, lng, alt, spd, sat) {
    if (!leafMap || isNaN(lat) || isNaN(lng)) return;
    gpsMarker.setLatLng([lat, lng]);
    leafMap.setView([lat, lng], leafMap.getZoom());
    $('gpsCoords').textContent =
      '经度 ' + lng.toFixed(6) + '  纬度 ' + lat.toFixed(6) +
      '  海拔 ' + (alt || 0).toFixed(1) + 'm  速度 ' + (spd || 0).toFixed(1) + 'km/h  卫星 ' + (sat || 0);
  }
  function isRealGpsFix(d) {
    return Number(d && d.fix || 0) === 1;
  }

  client.on('message', (topic, payload) => {
    touchData();
    const msg = payload.toString();
    const now = new Date();
    const ts = [now.getHours(), now.getMinutes(), now.getSeconds()]
      .map(n => String(n).padStart(2,'0')).join(':');

    if (topic === 'esp32/temp') {
      currentTemp = parseFloat(msg);
      updateTemp(currentTemp);
    } else if (topic === 'esp32/hum') {
      currentHum = parseFloat(msg);
      updateHum(currentHum);
    } else if (topic === 'esp32/status') {
      try {
        const d = JSON.parse(msg);
        if (d.temp !== null) { currentTemp = parseFloat(d.temp); updateTemp(currentTemp); }
        if (d.hum !== null) { currentHum = parseFloat(d.hum); updateHum(currentHum); }
        $('ipVal').textContent = d.ip || '--';
        updateSignal(d.rssi);
        $('uptimeVal').textContent = Math.floor(d.uptime / 60) + '分钟';
      } catch(e) {}
    } else if (topic === 'esp32/led') {
      try {
        const d = JSON.parse(msg);
        ledOn = d.led === 'on';
        updateLedUI();
      } catch(e) {}
    } else if (topic === 'esp32/gps') {
      try {
        const d = JSON.parse(msg);
        if (isRealGpsFix(d)) updateMarker(d.lat, d.lng, d.alt, d.spd, d.sat);
      } catch(e) {}
    }

    // 从 status 中提取 GPS
    if (topic === 'esp32/status') {
      try {
        const d = JSON.parse(msg);
        if (d.lat && d.lng && isRealGpsFix(d)) updateMarker(d.lat, d.lng, d.alt, d.spd, d.sat);
      } catch(e) {}
    }

    $('updatedAt').textContent = ts;

    // 记录历史数据
    if (currentTemp !== null || currentHum !== null) {
      addHistory(now, currentTemp, currentHum);
    }

    // 告警检查
    checkAlerts();
  });

  // ==================== 历史数据 ====================
  function addHistory(ts, temp, hum) {
    if (historyMode !== 'live') return;
    history.push({ ts: ts.getTime(), temp, hum });
    if (history.length > MAX_HISTORY) history.shift();
    // 每 20 条压缩存一次 localStorage
    if (history.length % 20 === 0) saveHistoryToStorage();
    // 更新迷你趋势线
    pushSpark(sparkTemp, temp);
    pushSpark(sparkHum, hum);
    if (sparkTemp.length >= 2) {
      const tMin = Math.min(...sparkTemp), tMax = Math.max(...sparkTemp);
      const tPad = (tMax - tMin) * 0.2 || 1;
      drawSparkline('sparkTemp', sparkTemp, '#ff7b42', tMin - tPad, tMax + tPad);
    }
    if (sparkHum.length >= 2) {
      const hMin = Math.min(...sparkHum), hMax = Math.max(...sparkHum);
      const hPad = (hMax - hMin) * 0.2 || 1;
      drawSparkline('sparkHum', sparkHum, '#4f8fff', hMin - hPad, hMax + hPad);
    }

    // 只更新最后一个点，不重绘整个图表（性能优化）
    if (chart && historyMode === 'live') {
      const last = history[history.length - 1];
      const d = new Date(last.ts);
      const label = [d.getHours(), d.getMinutes(), d.getSeconds()].map(n => String(n).padStart(2,'0')).join(':');
      chart.data.labels.push(label);
      chart.data.datasets[0].data.push(last.temp);
      chart.data.datasets[1].data.push(last.hum);
      // 只保留最近 60 个标签在图表上（滑动窗口）
      while (chart.data.labels.length > 60) {
        chart.data.labels.shift();
        chart.data.datasets[0].data.shift();
        chart.data.datasets[1].data.shift();
      }
      chart.update('none');
    }
  }

  // ==================== Chart.js ====================
  let chart;
  function initChart() {
    const ctx = $('chartCanvas').getContext('2d');
    chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: [],
        datasets: [
          {
            label: '温度 °C',
            data: [],
            borderColor: '#ff7b42',
            backgroundColor: 'rgba(255,123,66,0.08)',
            borderWidth: 2,
            pointRadius: 0,
            tension: 0.3,
            fill: true,
            yAxisID: 'y'
          },
          {
            label: '湿度 %',
            data: [],
            borderColor: '#4f8fff',
            backgroundColor: 'rgba(79,143,255,0.06)',
            borderWidth: 2,
            pointRadius: 0,
            tension: 0.3,
            fill: true,
            yAxisID: 'y1'
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { intersect: false, mode: 'index' },
        plugins: {
          legend: {
            labels: { color: '#8b8f9a', usePointStyle: true, boxWidth: 8, font: { size: 10 }, padding: 16 }
          },
          thresholdLine: {
            id: 'thresholdLine',
            afterDraw(chart) {
              const ctx = chart.ctx, xAxis = chart.scales.x, yAxis = chart.scales.y, y1Axis = chart.scales.y1;
              if (!xAxis || !yAxis) return;
              ctx.save();
              // 温度阈值线（y 轴）
              const tempY = yAxis.getPixelForValue(thresholds.tempMax);
              ctx.setLineDash([6, 4]);
              ctx.strokeStyle = 'rgba(255,71,87,0.5)';
              ctx.lineWidth = 1;
              ctx.beginPath();
              ctx.moveTo(xAxis.left, tempY);
              ctx.lineTo(xAxis.right, tempY);
              ctx.stroke();
              ctx.fillStyle = 'rgba(255,71,87,0.7)';
              ctx.font = '9px sans-serif';
              ctx.fillText('⚠' + thresholds.tempMax + '°C', xAxis.right - 42, tempY - 6);
              // 湿度阈值线（y1 轴）
              if (y1Axis) {
                const humY = y1Axis.getPixelForValue(thresholds.humMin);
                ctx.beginPath();
                ctx.moveTo(xAxis.left, humY);
                ctx.lineTo(xAxis.right, humY);
                ctx.stroke();
                ctx.fillText('⚠' + thresholds.humMin + '%', xAxis.right - 38, humY - 6);
              }
              ctx.setLineDash([]);
              ctx.restore();
            }
          },
          crosshairLine: {
            id: 'crosshairLine',
            afterDraw() { /* 改用 CSS overlay，见下方 #crosshair */ }
          }
        },
        scales: {
          x: {
            ticks: { color: '#5a5e6a', font: { size: 9 }, maxTicksLimit: 6 },
            grid: { color: 'rgba(255,255,255,0.03)' }
          },
          y: {
            type: 'linear', position: 'left',
            ticks: { color: '#ff7b42', font: { size: 9 }, callback: v => v + '°' },
            grid: { color: 'rgba(255,255,255,0.03)' },
            min: 0, max: 60
          },
          y1: {
            type: 'linear', position: 'right',
            ticks: { color: '#4f8fff', font: { size: 9 }, callback: v => v + '%' },
            grid: { display: false },
            min: 0, max: 100
          }
        }
      }
    });

    // 鼠标/触摸竖线跟踪（CSS overlay 方案）
    const ch = $('crosshair'), chTemp = ch.querySelector('.crosshair-tag.temp'), chHum = ch.querySelector('.crosshair-tag.hum');

    function updateCrosshair(clientX, clientY) {
      const rect = chart.canvas.getBoundingClientRect();
      const x = clientX - rect.left;
      if (x < 0 || x > rect.width) { ch.classList.remove('show'); return; }
      ch.style.left = x + 'px';
      ch.classList.add('show');

      // 反查数据点（DPR 修正）
      const xAxis = chart.scales.x;
      if (!xAxis || chart.data.labels.length === 0) return;
      const dpr = window.devicePixelRatio || 1;
      const left = xAxis.left / dpr, right = xAxis.right / dpr;
      const step = (right - left) / Math.max(chart.data.labels.length - 1, 1);
      const idx = Math.round((x - left) / step);
      if (idx >= 0 && idx < chart.data.labels.length) {
        const tv = chart.data.datasets[0].data[idx], hv = chart.data.datasets[1].data[idx];
        chTemp.textContent = tv !== null && tv !== undefined ? tv.toFixed(1) + '°C' : '--';
        chHum.textContent = hv !== null && hv !== undefined ? Math.round(hv) + '%' : '--';
        chTemp.style.display = ''; chHum.style.display = '';
      } else {
        chTemp.style.display = 'none'; chHum.style.display = 'none';
      }
    }

    chart.canvas.addEventListener('mousemove', (e) => updateCrosshair(e.clientX, e.clientY));
    chart.canvas.addEventListener('mouseleave', () => ch.classList.remove('show'));
    chart.canvas.addEventListener('touchstart', (e) => { e.preventDefault(); updateCrosshair(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });
    chart.canvas.addEventListener('touchmove', (e) => { e.preventDefault(); updateCrosshair(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });
    chart.canvas.addEventListener('touchend', () => ch.classList.remove('show'));
  }

  function updateChart() {
    if (!chart) return;
    // 只显示最近 60 个点
    const points = history.slice(-60);
    chart.data.labels = points.map(p => {
      const d = new Date(p.ts);
      return [d.getHours(), d.getMinutes()].map(n => String(n).padStart(2,'0')).join(':');
    });
    chart.data.datasets[0].data = points.map(p => p.temp);
    chart.data.datasets[1].data = points.map(p => p.hum);
    chart.update('none');
  }

  // ==================== 迷你趋势线 (Sparkline) ====================
  function pushSpark(arr, v) {
    if (v === null || isNaN(v)) return;
    arr.push(v);
    if (arr.length > SPARK_MAX) arr.shift();
  }

  function drawSparkline(canvasId, data, color, minY, maxY) {
    const c = $(canvasId); if (!c) return;
    const w = c.width, h = c.height;
    const ctx = c.getContext('2d');
    ctx.clearRect(0, 0, w, h);
    if (data.length < 2) return;
    const pad = { t: 3, r: 2, b: 3, l: 2 };
    const pw = w - pad.l - pad.r, ph = h - pad.t - pad.b;
    const range = (maxY - minY) || 1;
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    data.forEach((v, i) => {
      const x = pad.l + (i / (data.length - 1)) * pw;
      const y = pad.t + ph - ((v - minY) / range) * ph;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();
  }

  // ==================== 温湿度更新 ====================
  function updateTemp(v) {
    if (isNaN(v)) return;
    $('tempVal').textContent = v.toFixed(1);
    const trend = $('tempTrend');
    if (lastTemp !== null) {
      const diff = v - lastTemp;
      if (Math.abs(diff) >= 0.1) {
        trend.textContent = (diff > 0 ? '↑' : '↓') + Math.abs(diff).toFixed(1) + '°C';
        trend.style.color = diff > 0 ? 'var(--warm)' : 'var(--accent)';
      }
    }
    lastTemp = v;
    saveCache();
  }

  function updateHum(v) {
    if (isNaN(v)) return;
    $('humVal').textContent = Math.round(v);
    const trend = $('humTrend');
    if (lastHum !== null) {
      const diff = Math.round(v - lastHum);
      if (Math.abs(diff) >= 1) {
        trend.textContent = (diff > 0 ? '↑' : '↓') + Math.abs(diff) + '%';
        trend.style.color = diff > 0 ? 'var(--accent)' : 'var(--warm)';
      }
    }
    lastHum = v;
    saveCache();
  }

  function saveCache() {
    try {
      localStorage.setItem('esp32_cache', JSON.stringify({
        temp: lastTemp, hum: lastHum, rssi: $('rssiVal').textContent,
        uptime: $('uptimeVal').textContent, ip: $('ipVal').textContent,
        led: ledOn, ts: Date.now()
      }));
    } catch(e) {}
  }
  function loadCache() {
    try {
      const raw = localStorage.getItem('esp32_cache');
      if (!raw) return;
      let d;
      try { d = JSON.parse(raw); } catch(e) { d = JSON.parse(LZString.decompressFromUTF16(raw)); }
      if (d && Date.now() - d.ts < 86400000) {
        if (d.temp !== null) updateTemp(d.temp);
        if (d.hum !== null) updateHum(d.hum);
        if (d.rssi) $('rssiVal').textContent = d.rssi;
        if (d.uptime) $('uptimeVal').textContent = d.uptime;
        if (d.ip) $('ipVal').textContent = d.ip;
        ledOn = d.led; updateLedUI();
        $('updatedAt').textContent = new Date(d.ts).toLocaleTimeString('zh-CN', {hour12: false});
      }
    } catch(e) {}
  }

  // ==================== 压缩历史持久化 (LZ-String) ====================
  function saveHistoryToStorage() {
    try {
      const compressed = LZString.compressToUTF16(JSON.stringify(history));
      localStorage.setItem('esp32_history', compressed);
    } catch(e) {
      if (e.name === 'QuotaExceededError' || String(e).indexOf('quota') > -1) {
        history = history.slice(Math.floor(history.length / 2));
        try { saveHistoryToStorage(); } catch(e2) {}
      }
    }
  }

  function loadHistoryFromStorage() {
    try {
      const raw = localStorage.getItem('esp32_history');
      if (!raw) return;
      const decompressed = LZString.decompressFromUTF16(raw);
      if (!decompressed) return;
      const arr = JSON.parse(decompressed);
      if (Array.isArray(arr) && arr.length > 0) {
        const todayStart = new Date(); todayStart.setHours(0,0,0,0);
        history = arr.filter(p => p.ts >= todayStart.getTime());
        if (history.length > 0) { updateChart(); seedSparklines(); }
      }
    } catch(e) { localStorage.removeItem('esp32_history'); }
  }

  function seedSparklines() {
    // 用 history 尾部最近 SPARK_MAX 个点填充迷你趋势线
    const tail = history.slice(-SPARK_MAX);
    sparkTemp = tail.map(p => p.temp).filter(v => v !== null && !isNaN(v));
    sparkHum = tail.map(p => p.hum).filter(v => v !== null && !isNaN(v));
    if (sparkTemp.length >= 2) {
      const tMin = Math.min(...sparkTemp), tMax = Math.max(...sparkTemp);
      const pad = (tMax - tMin) * 0.2 || 1;
      drawSparkline('sparkTemp', sparkTemp, '#ff7b42', tMin - pad, tMax + pad);
    }
    if (sparkHum.length >= 2) {
      const hMin = Math.min(...sparkHum), hMax = Math.max(...sparkHum);
      const pad = (hMax - hMin) * 0.2 || 1;
      drawSparkline('sparkHum', sparkHum, '#4f8fff', hMin - pad, hMax + pad);
    }
  }

  function updateSignal(rssi) {
    $('rssiVal').textContent = rssi + ' dBm';
    saveCache();
  }

  // ==================== 浏览器推送通知 ====================
  let notifyEnabled = false;
  let lastNotifyTime = 0;
  const NOTIFY_COOLDOWN = 120000; // 2 分钟内不重复推送

  function requestNotify() {
    if ('Notification' in window) {
      if (Notification.permission === 'granted') {
        notifyEnabled = true;
      } else if (Notification.permission !== 'denied') {
        Notification.requestPermission().then(p => {
          notifyEnabled = (p === 'granted');
        });
      }
    }
  }

  function sendNotify(title, body) {
    if (!notifyEnabled) return;
    const now = Date.now();
    if (now - lastNotifyTime < NOTIFY_COOLDOWN) return;
    lastNotifyTime = now;
    try { new Notification(title, { body, icon: '🌡️', tag: 'esp32-alert' }); } catch(e) {}
  }

  // ==================== 告警检查 ====================
  function checkAlerts() {
    const bar = $('alertBar');
    const temp = lastTemp;
    const hum = lastHum;
    const mode = thresholds.alertMode;

    let alert = null;
    if ((mode === 'both' || mode === 'temp') && temp !== null && temp >= thresholds.tempMax) {
      alert = { cls: 'danger', msg: `🚨 温度过高！当前 ${temp.toFixed(1)}°C，超过上限 ${thresholds.tempMax}°C` };
    }
    if ((mode === 'both' || mode === 'hum') && hum !== null && hum <= thresholds.humMin) {
      alert = { cls: 'warn', msg: `⚠️ 湿度过低！当前 ${Math.round(hum)}%，低于下限 ${thresholds.humMin}%` };
    }

    if (alert) {
      bar.className = 'alert-bar show ' + alert.cls;
      bar.textContent = alert.msg;
      // 推送浏览器通知
      sendNotify('ESP32 环境告警', alert.msg.replace(/[🚨⚠️]/g, '').trim());
    } else {
      bar.className = 'alert-bar';
    }
  }

  // ==================== 设备控制 ====================
  function toggleDevice(type) {
    if (type === 'led') {
      ledOn = !ledOn;
      updateLedUI();
      client.publish('esp32/cmd', JSON.stringify({ led: ledOn ? 'on' : 'off' }));
      showToast(ledOn ? 'LED 已打开' : 'LED 已关闭');
    }
  }

  function updateLedUI() {
    const btn = $('ledToggle');
    const st = $('ledStatus');
    if (ledOn) { btn.className = 'toggle on'; st.textContent = '已开启'; }
    else { btn.className = 'toggle off'; st.textContent = '已关闭'; }
    saveCache();
  }

  // ==================== 加载历史数据 ====================
  let historyMode = 'live'; // 'live' | 'history'

  function setHistoryDate() {
    const d = new Date();
    $('histDate').value = d.toISOString().slice(0,10);
  }

  async function loadHistory(mode) {
    // 按钮高亮状态切换
    document.querySelectorAll('.btn-sm[data-mode]').forEach(b => {
      b.classList.toggle('active', b.dataset.mode === mode);
    });
    // date 模式下取消所有按钮高亮
    if (mode === 'date') {
      document.querySelectorAll('.btn-sm[data-mode]').forEach(b => b.classList.remove('active'));
    }

    let params = '';
    const today = new Date().toISOString().slice(0,10);

    if (mode === 'today') {
      params = `?date=${today}`;
    } else if (mode === 'yesterday') {
      const y = new Date(Date.now() - 86400000).toISOString().slice(0,10);
      params = `?date=${y}`;
    } else if (mode === '7days') {
      params = '?range=7days&format=hourly';
    } else if (mode === 'date') {
      const date = $('histDate').value;
      const from = $('histFrom').value;
      const to = $('histTo').value;
      if (!date) return;
      params = `?date=${date}&from=${from}&to=${to}`;
    }

    try {
      const res = await fetch(API_BASE + params);
      const json = await res.json();
      if (json.status === 'ok' && json.data.length > 0) {
        historyMode = 'history';
        $('histCount').textContent = `${json.data.length} 条`;
        renderHistory(json.data);
      } else {
        $('histCount').textContent = '无数据';
        clearChart();
      }
    } catch(e) {
      $('histCount').textContent = 'API 不可用';
      clearChart();
    }
  }

  function clearChart() {
    if (!chart) return;
    chart.data.labels = [];
    chart.data.datasets[0].data = [];
    chart.data.datasets[1].data = [];
    chart.update();
  }

  function renderHistory(data) {
    if (!chart) return;
    historyMode = 'history';
    // 显示全部数据点
    chart.data.labels = data.map(p => {
      const d = new Date(p.ts.replace(' ','T') + '+08:00');
      if (data.length > 200) {
        return [d.getMonth()+1, d.getDate()].map(n=>String(n).padStart(2,'0')).join('/') + ' ' + [d.getHours(), d.getMinutes()].map(n=>String(n).padStart(2,'0')).join(':');
      }
      return [d.getHours(), d.getMinutes(), d.getSeconds()].map(n=>String(n).padStart(2,'0')).join(':');
    });
    chart.data.datasets[0].data = data.map(p => p.temp);
    chart.data.datasets[1].data = data.map(p => p.hum);
    chart.update();
    // 5 分钟后自动恢复实时模式
    clearTimeout(window._histTimer);
    window._histTimer = setTimeout(() => { historyMode = 'live'; $('histCount').textContent = ''; loadHistory('today'); }, 300000);
  }

  // ==================== CSV 导出 ====================
  function exportCSV() {
    if (history.length === 0) { showToast('暂无数据可导出'); return; }
    let csv = '时间,温度(°C),湿度(%)\n';
    history.forEach(p => {
      const d = new Date(p.ts);
      const t = [d.getHours(), d.getMinutes(), d.getSeconds()]
        .map(n => String(n).padStart(2,'0')).join(':');
      csv += `${t},${p.temp ?? ''},${p.hum ?? ''}\n`;
    });
    const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `esp32_data_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('CSV 已下载');
  }

  // ==================== 工具 ====================
  let toastTimer;
  function showToast(msg) {
    const el = $('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
  }

  // ==================== 禁止双指缩放 ====================
  document.addEventListener('gesturestart', e => e.preventDefault(), { passive: false });
  document.addEventListener('gesturechange', e => e.preventDefault(), { passive: false });
  document.addEventListener('gestureend', e => e.preventDefault(), { passive: false });
  document.addEventListener('touchstart', e => {
    if (e.touches.length > 1) e.preventDefault();
  }, { passive: false });
  document.addEventListener('wheel', e => {
    if (e.ctrlKey) e.preventDefault();
  }, { passive: false });

  // ==================== 秒开预加载（PHP API） ====================
  async function preloadLatest() {
    try {
      const res = await fetch(API_BASE + '?latest=1');
      const json = await res.json();
      if (json.latest && json.latest.temp !== null) {
        updateTemp(json.latest.temp);
        updateHum(json.latest.hum);
        if (json.latest.rssi) $('rssiVal').textContent = json.latest.rssi + ' dBm';
        $('updatedAt').textContent = '缓存';
      }
    } catch(e) {}
  }

  async function preloadHistory() {
    // 首次打开拉取今天全部数据填充 history[] 和图表
    try {
      const today = new Date().toISOString().slice(0, 10);
      const res = await fetch(API_BASE + '?date=' + today);
      const json = await res.json();
      if (json.status === 'ok' && json.data.length > 0) {
        history = json.data.map(p => ({
          ts: new Date(p.ts.replace(' ', 'T') + '+08:00').getTime(),
          temp: p.temp, hum: p.hum
        }));
        $('histCount').textContent = history.length + ' 条(API)';
        updateChart();
        seedSparklines();
        // 不改变 historyMode，保持 live 以便 MQTT 续接
      }
    } catch(e) {}
  }

  // ==================== 启动 ====================
  setHistoryDate();
  requestNotify();
  initChart();
  initMap();
  loadCache();              // 1. localStorage: 仪表读数（秒开）
  loadHistoryFromStorage(); // 2. localStorage: 压缩的历史曲线（秒开）
  preloadLatest();          // 3. PHP API: 最新读数
  preloadHistory();         // 4. PHP API: 今天全部数据 + 填充 history[]
</script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>

  <!-- 断线蒙版 -->
  <div class="dc-overlay" id="dcOverlay">
    <div class="dc-icon">📡</div>
    <div class="dc-msg">ESP32 连接中断</div>
    <div class="dc-sub">超过 6 秒未收到数据，请检查设备</div>
  </div>
